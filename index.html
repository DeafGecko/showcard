<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShowCard - Smart Vis-Com Cards</title>
    <meta name="description" content="ShowCard is a communication card app for Deaf and Hard of Hearing people. Write a message once, save it as a card, and show it full screen when you need it.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        body {
            font-family: "Atkinson Hyperlegible", "Helvetica Neue", sans-serif;
            background-color: #f7f5f0;
            color: #000;
            margin: 0;
            overflow-x: hidden;
        }
        .high-contrast-text {
            color: #ffef00;
        }
        .intro-splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--splash-bg, #f7f5f0);
            pointer-events: none;
        }
        .intro-splash.is-leaving {
            animation: intro-splash-out 1s ease-in both;
        }
        .intro-splash-lockup {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        /* Starts offset by half the name's width, so the icon sits centered on its own.
           The script sets --intro-shift; it stays 0 without JS, which just shows the final lockup. */
        .intro-splash-mark {
            display: flex;
            transform: translateX(var(--intro-shift, 0px));
            animation: intro-splash-move 0.8s ease-in-out 1.5s both;
        }
        /* The mark is drawn as a mask so it takes the saved accent color, like the header icon. */
        .intro-splash-logo {
            width: 64px;
            height: 64px;
            background-color: var(--splash-accent, #FACC15);
            -webkit-mask: url(/showcard-mark.svg) center / contain no-repeat;
            mask: url(/showcard-mark.svg) center / contain no-repeat;
            animation: intro-splash-logo-in 1.2s ease-out both;
        }
        .intro-splash-name {
            margin: 0;
            padding-right: 4px;
            color: var(--splash-fg, #000000);
            font-family: "Atkinson Hyperlegible", "Helvetica Neue", sans-serif;
            font-size: 48px;
            font-weight: 900;
            line-height: 1;
            white-space: nowrap;
            clip-path: inset(0 100% 0 0);
            animation: intro-splash-reveal 0.8s ease-out 2.3s both;
        }
        @keyframes intro-splash-logo-in {
            from { opacity: 0; transform: scale(1.5); filter: blur(8px); }
            to   { opacity: 1; transform: scale(1); filter: blur(0); }
        }
        @keyframes intro-splash-move {
            from { transform: translateX(var(--intro-shift, 0px)); }
            to   { transform: translateX(0); }
        }
        @keyframes intro-splash-reveal {
            from { clip-path: inset(0 100% 0 0); }
            to   { clip-path: inset(0 0 0 0); }
        }
        @keyframes intro-splash-out {
            from { opacity: 1; }
            to   { opacity: 0; }
        }
    </style>
    <link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="intro-splash" class="intro-splash" aria-hidden="true">
        <div class="intro-splash-lockup">
            <div class="intro-splash-mark">
                <div class="intro-splash-logo" aria-hidden="true"></div>
            </div>
            <h1 id="intro-splash-name" class="intro-splash-name">ShowCard</h1>
        </div>
    </div>
    <script>
        // Plays the intro once per browser session. Skipped entirely for reduced motion.
        (function () {
            var splash = document.getElementById('intro-splash');
            if (!splash) return;
            var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var seen = false;
            try { seen = sessionStorage.getItem('showcard-intro-seen') === '1'; } catch (e) {}
            if (reduceMotion || seen) {
                splash.remove();
                return;
            }
            // Follow the color mode and accent the visitor saved in the app. Defaults match a new visit.
            var modes = {
                light: { bg: '#f7f5f0', fg: '#000000' },
                dark: { bg: '#121212', fg: '#f1f1ed' },
                highContrast: { bg: '#000000', fg: '#ffef00' }
            };
            var prefs = null;
            try { prefs = JSON.parse(localStorage.getItem('visio_prefs')); } catch (e) {}
            var mode = prefs && modes[prefs.themeMode] ? modes[prefs.themeMode] : modes.light;
            var accent = prefs && typeof prefs.accentColor === 'string' ? prefs.accentColor : '#FACC15';
            splash.style.setProperty('--splash-bg', mode.bg);
            splash.style.setProperty('--splash-fg', mode.fg);
            splash.style.setProperty('--splash-accent', accent);
            try { sessionStorage.setItem('showcard-intro-seen', '1'); } catch (e) {}
            // Icon comes in (0-1.2s), moves left (1.5-2.3s), name reveals (2.3-3.1s).
            // Hold until 4s, fade out over 1s, then remove.
            var name = document.getElementById('intro-splash-name');
            // Half of the name plus the 12px lockup gap, so the icon starts centered on its own.
            // Measured again once the font is ready, since the fallback font is wider.
            var setShift = function () {
                if (name) splash.style.setProperty('--intro-shift', ((name.offsetWidth + 12) / 2) + 'px');
            };
            setShift();
            window.addEventListener('load', setShift);
            if (document.fonts) document.fonts.addEventListener('loadingdone', setShift);
            setTimeout(function () { splash.classList.add('is-leaving'); }, 4000);
            setTimeout(function () { splash.remove(); }, 5000);
        })();
    </script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
